name: Publicar JARVIS no GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.mjs'
      - 'styles.css'
      - 'assets/**'
      - 'manifest.webmanifest'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/build.mjs'
      - 'tests/distribution.test.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar pasta compilada
        id: deployment
        uses: actions/deploy-pages@v5
