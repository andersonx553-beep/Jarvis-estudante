name: Validar integração Firebase
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  emuladores:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Regras, autenticação e sincronização no projeto demo
        run: npm run test:firebase
